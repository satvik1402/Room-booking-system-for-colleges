<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(50, 50)">
    <!-- Document with content -->
    <rect x="50" y="0" width="200" height="280" rx="10" fill="white" stroke="#e0e0e0" strokeWidth="2"/>
    
    <!-- Document content lines -->
    <rect x="70" y="30" width="160" height="8" rx="4" fill="#f0f0f0"/>
    <rect x="70" y="50" width="160" height="8" rx="4" fill="#f0f0f0"/>
    <rect x="70" y="70" width="120" height="8" rx="4" fill="#f0f0f0"/>
    <rect x="70" y="110" width="160" height="8" rx="4" fill="#f0f0f0"/>
    <rect x="70" y="130" width="160" height="8" rx="4" fill="#f0f0f0"/>
    <rect x="70" y="150" width="120" height="8" rx="4" fill="#f0f0f0"/>
    <rect x="70" y="190" width="160" height="8" rx="4" fill="#f0f0f0"/>
    <rect x="70" y="210" width="160" height="8" rx="4" fill="#f0f0f0"/>
    <rect x="70" y="230" width="120" height="8" rx="4" fill="#f0f0f0"/>
    
    <!-- Circle UI element -->
    <circle cx="100" cy="100" r="20" fill="white" stroke="#e0e0e0" strokeWidth="2"/>
    <circle cx="100" cy="100" r="10" fill="#f0f0f0"/>
    
    <!-- Standing person on the left -->
    <g transform="translate(0, 100)">
      <!-- Body -->
      <rect x="0" y="40" width="30" height="70" rx="5" fill="white"/>
      <!-- Head -->
      <circle cx="15" cy="20" r="20" fill="white"/>
      <!-- Legs -->
      <rect x="5" y="110" width="8" height="70" rx="3" fill="white"/>
      <rect x="17" y="110" width="8" height="70" rx="3" fill="white"/>
      <!-- Arms -->
      <rect x="-10" y="50" width="40" height="8" rx="4" fill="white" transform="rotate(-30 -10 50)"/>
      <!-- Phone -->
      <rect x="-25" y="60" width="20" height="35" rx="3" fill="#f0f0f0" stroke="white" strokeWidth="1"/>
    </g>
    
    <!-- Sitting person on the right -->
    <g transform="translate(250, 50)">
      <!-- Body -->
      <rect x="0" y="40" width="30" height="60" rx="5" fill="white"/>
      <!-- Head -->
      <circle cx="15" cy="20" r="20" fill="white"/>
      <!-- Legs -->
      <rect x="0" y="100" width="50" height="8" rx="4" fill="white" transform="rotate(45 0 100)"/>
      <rect x="-10" y="130" width="50" height="8" rx="4" fill="white" transform="rotate(45 -10 130)"/>
      <!-- Laptop -->
      <rect x="-40" y="80" width="40" height="30" rx="2" fill="#f0f0f0" stroke="white" strokeWidth="1"/>
      <rect x="-40" y="80" width="40" height="3" rx="1" fill="white"/>
      <!-- Arms -->
      <rect x="-20" y="60" width="30" height="8" rx="4" fill="white" transform="rotate(-10 -20 60)"/>
    </g>
    
    <!-- Decorative leaves -->
    <path d="M275 140 C290 120, 310 130, 300 150 Z" fill="white"/>
    <path d="M280 200 C300 180, 315 190, 305 210 Z" fill="white"/>
    <path d="M30 240 C15 220, 0 230, 10 250 Z" fill="white"/>
    <path d="M20 180 C5 160, -10 170, 0 190 Z" fill="white"/>
  </g>
</svg>