<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Logo shape -->
  <defs>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f05a28" />
      <stop offset="100%" style="stop-color:#ef3e24" />
    </linearGradient>
  </defs>
  
  <!-- Laurel wreath -->
  <g fill="none" stroke="#8b4513" stroke-width="2">
    <!-- Left side of wreath -->
    <path d="M50,130 C40,110 35,90 40,70 C30,80 25,100 30,120 Z" />
    <path d="M45,130 C35,105 30,85 35,65 C25,75 20,95 25,115 Z" />
    <path d="M40,125 C30,100 25,80 30,60 C20,70 15,90 20,110 Z" />
    <path d="M35,120 C25,95 20,75 25,55 C15,65 10,85 15,105 Z" />
    
    <!-- Right side of wreath -->
    <path d="M150,130 C160,110 165,90 160,70 C170,80 175,100 170,120 Z" />
    <path d="M155,130 C165,105 170,85 165,65 C175,75 180,95 175,115 Z" />
    <path d="M160,125 C170,100 175,80 170,60 C180,70 185,90 180,110 Z" />
    <path d="M165,120 C175,95 180,75 175,55 C185,65 190,85 185,105 Z" />
  </g>
  
  <!-- Main logo part -->
  <circle cx="100" cy="50" r="15" fill="url(#orangeGradient)" />
  <path d="M85,65 L100,90 L115,65" fill="url(#orangeGradient)" />
  <rect x="85" y="70" width="30" height="35" rx="2" fill="url(#orangeGradient)" />
  
  <!-- Text -->
  <text x="100" y="150" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#8b4513">INSPIRED BY LIFE</text>
</svg>